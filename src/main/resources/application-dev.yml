spring:
  application:
    name: apigw
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  cloud:
    gateway:
      # 路由定义从我们的 RedisRouteDefinitionRepository 读，不走 yml 静态路由
      discovery:
        locator:
          enabled: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.apigw: debug
